<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold text-white" href="/">
            <img src="{{ url_for('static', filename='img/Logo_House_Manager.svg') }}" 
                alt="Logo" 
                style="height: 40px; width: auto; margin-right: 12px; filter: brightness(0) invert(1);">
            House Manager
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center">
                <li class="nav-item" id="auth-section">
                    <a class="nav-link text-white" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">
                        Accedi <i class="fas fa-user-circle fa-lg ms-1"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}?v=3"></script>
</body>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Accedi a House Manager</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm"> <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div id="login-error" class="text-danger small mb-2 d-none">Credenziali errate!</div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Entra</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer justify-content-center">
                    <small>Non hai un account? <a href="/registrazione" onclick="chiudiModal()">Registrati</a></small>
                </div>
            </div>
        </div>
    </div>

    </body>
</html>
</html>
